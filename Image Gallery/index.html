<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Logos Pet Image Gallery</h1>
    <div class="exterior">
        <img src="images/back.png" alt="" id="backBtn">

        <div class="container">
            <div>
                <span> <img src="images/cat 1.jpg" alt="cat picture"></span>
                <span> <img src="images/dog 1.jpg" alt="dog picture"></span>
                <span> <img src="images/parrot 1.jpg" alt="parrot picture"></span>
            </div>
            <div>
                <span> <img src="images/cat 2.jpg" alt="cat picture"></span>
                <span> <img src="images/dog 2.jpg" alt="dog picture"></span>
                <span> <img src="images/parrot 2.jpg" alt="parrot picture"></span>
            </div>
            <div>
                <span> <img src="images/cat 3.jpg" alt="cat picture"></span>
                <span> <img src="images/dog 3.jpg" alt="dog picture"></span>
                <span> <img src="images/parrot 3.jpg" alt="parrot picture"></span>
            </div>
            <div>
                <span> <img src="images/cat 4.jpg" alt="cat picture"></span>
                <span> <img src="images/dog 4.jpg" alt="dog picture"></span>
                <span> <img src="images/parrot 4.jpg" alt="parrot picture"></span>
            </div>
            <div>
                <span> <img src="images/cat 5.jpg" alt="cat picture"></span>
                <span> <img src="images/dog 5.jpg" alt="dog picture"></span>
                <span> <img src="images/parrot 5.jpg" alt="parrot picture"></span>
            </div>
        </div>

        <img src="images/next.png" alt="" id="nextBtn">
    </div>
    
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-img" id="lightboxImg">
        <div class="counter" id="counter"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
